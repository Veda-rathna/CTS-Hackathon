version: "3.9"

services:
  # ── FastAPI application ──────────────────────────────────────────────────────
  api:
    build: .
    container_name: prior-auth-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Prior Authorization Triage API
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      # Set USE_MOCK_REPOSITORIES=false and provide DATABASE_URL to use PostgreSQL
      - USE_MOCK_REPOSITORIES=${USE_MOCK_REPOSITORIES:-true}
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/prior_auth
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8501
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Mount source for development hot-reload
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: prior-auth-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prior_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prior_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
